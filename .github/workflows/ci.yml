name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time stand-ins — real secrets live in Vercel env vars.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_SECRET: "ci-secret-at-least-32-characters-long-000"
      ADMIN_EMAIL: "ci@example.com"
      ADMIN_PASSWORD: "ci-password"
      RESEND_API_KEY: ""
      EMAIL_FROM: "Mini ATS <ci@example.com>"
      NOTIFY_EMAIL: "ci@example.com"
      APP_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
